; Starter universe for paper trading on Binance public data: BTC and ETH spot
; plus the BTC perpetual, which is priced off spot with a learned basis.
;
;   python3 feeds/binance.py BTCUSDT ETHUSDT --perp BTCUSDT \
;     | ./build/amm_run --config config/crypto.ini --record data/crypto.csv
;
; The numbers below are placeholders of the right order of magnitude. Record
; an hour, run amm_calibrate on it, and replace vol / A0 / k0 / corr with
; what it reports before reading anything into the paper P&L.
; Factor levels are set from the first book, so `level` only needs to be rough.

[engine]
gamma = 0.05        ; risk aversion per unit of quote currency (USDT)
hedge_band = 15     ; USDT per sqrt(second) of net factor risk before hedging
risk_limit = 60
max_loss = 500      ; kill switch on paper P&L

[paper]
latency_ms = 50     ; order round trip you expect from your location

[factor BTC]
level = 60000
vol = 6.0           ; USDT per sqrt(second)
[factor ETH]
level = 3000
vol = 0.45

[corr]
BTC ETH = 0.8

[instrument BTC-USDT]
feed = BINANCE:BTCUSDT
class = crypto_spot
tick = 0.01
lot = 0.00001
mult = 1
quote_size = 0.005
max_pos = 0.1
A0 = 1.0
k0 = 0.5
pricer = linear BTC
ref_for = BTC
hedges = BTC

[instrument ETH-USDT]
feed = BINANCE:ETHUSDT
class = crypto_spot
tick = 0.01
lot = 0.0001
mult = 1
quote_size = 0.05
max_pos = 1.5
A0 = 1.0
k0 = 5
pricer = linear ETH
ref_for = ETH
hedges = ETH

[instrument BTC-USDT-PERP]
feed = BINANCE-PERP:BTCUSDT
class = crypto_perp
tick = 0.1
lot = 0.001
mult = 1
quote_size = 0.005
max_pos = 0.1
idio_vol = 0.5
A0 = 1.0
k0 = 0.5
pricer = linear BTC
