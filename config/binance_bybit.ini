; BTC and ETH USD-M perpetuals on Binance, quoted, with Binance SPOT BTC and
; ETH and Bybit's BTC and ETH perpetuals as reference markets: observed, never quoted. Each spot market also
; can observe its factor (ref_gain), and each perp can follow its spot market's
; recent move (lead = ..., lead_mode = momentum). Both are off: across three
; recorded sessions the lead did not pay at the 0.02% maker fee with 5-30 s
; quotes; it helped only with 1 s quotes at zero fee (DESIGN.md §11).
; This file adds Bybit's perpetuals as reference markets too, so either venue's
; spot or Bybit can be named as a perp's leader (lead = BTC-USDT-BYBIT).
; Matches:  python3 feeds/binance_ws.py BTCUSDT ETHUSDT --perp BTCUSDT ETHUSDT --bybit-perp BTCUSDT ETHUSDT
; Engine, fee and perp settings as config/binance_perp.ini (see its notes);

[engine]
gamma = 0.005
hedge_band = 15
risk_limit = 60
max_loss = 500
min_quote_life_ms = 30000 ; a quote is kept this long unless it must go (DESIGN.md §8)
wait_cancel_ack = true    ; one order in flight per side: replace only once the cancel is confirmed
fees_in_quotes = true     ; widen quotes by the maker fee: never quote where the edge cannot pay it

[paper]
latency_ms = 50
post_only = true          ; a quote that would take liquidity on arrival is rejected, as GTX is live

[factor BTC]
level = 65100
vol = 4.88
[factor ETH]
level = 1827
vol = 0.172

[corr]
BTC ETH = 0.7

[instrument BTC-USDT-PERP]
feed = BINANCE-PERP:BTCUSDT
maker_fee = 0.0002
taker_fee = 0.0005
class = crypto_perp
tick = 0.1
lot = 0.001
mult = 1
quote_size = 0.005
max_pos = 0.1
A0 = 0.274
k0 = 2.33
pricer = linear BTC
ref_for = BTC
hedges = BTC
lead = BTC-USDT-SPOT
lead_mode = momentum
lead_tau_ms = 100
lead_gain = 0

[instrument ETH-USDT-PERP]
feed = BINANCE-PERP:ETHUSDT
maker_fee = 0.0002
taker_fee = 0.0005
class = crypto_perp
tick = 0.01
lot = 0.001
mult = 1
quote_size = 0.1
max_pos = 2
A0 = 0.276
k0 = 19.7
pricer = linear ETH
ref_for = ETH
hedges = ETH
lead = ETH-USDT-SPOT
lead_mode = momentum
lead_tau_ms = 100
lead_gain = 0

[instrument BTC-USDT-SPOT]
feed = BINANCE:BTCUSDT
class = crypto_spot
tick = 0.01
lot = 0.00001
mult = 1
quote = false
pricer = linear BTC
ref_for = BTC
ref_gain = 0

[instrument ETH-USDT-SPOT]
feed = BINANCE:ETHUSDT
class = crypto_spot
tick = 0.01
lot = 0.0001
mult = 1
quote = false
pricer = linear ETH
ref_for = ETH
ref_gain = 0

[instrument BTC-USDT-BYBIT]
feed = BYBIT-PERP:BTCUSDT
class = crypto_perp
tick = 0.1
lot = 0.001
mult = 1
quote = false
pricer = linear BTC
ref_for = BTC
ref_gain = 0

[instrument ETH-USDT-BYBIT]
feed = BYBIT-PERP:ETHUSDT
class = crypto_perp
tick = 0.01
lot = 0.01
mult = 1
quote = false
pricer = linear ETH
ref_for = ETH
ref_gain = 0
