; BTC and ETH USD-M perpetuals on Binance, each the reference market for its
; own factor. Matches:  python3 feeds/binance_ws.py --perp BTCUSDT ETHUSDT
; (the REST adapter, feeds/binance.py --perp BTCUSDT ETHUSDT, also works).
; vol / A0 / k0 / corr come from amm_calibrate on a 4-hour websocket capture,
; 2026-11-15 20:30 to 11-16 00:30 UTC (11.3M events, no reconnects). vol is the total
; including jumps (diffusive alone: BTC 3.83, ETH 0.152; 29 and 21 jumps/hour).
; gamma and min_quote_life_ms were chosen with amm_sweep --jitter 15 (16 paths
; per setting) on that capture and on a separate 15-minute one (17:52-18:07
; UTC): gamma 0.005 beat 0.05 at every quote life on both; a 10 s quote life
; averaged +18.5 (4 h) and +10.5 (15 min), against -115 and -6 at 1 s. Paper
; results from one Sunday evening: re-sweep on other days before relying on them.

[engine]
gamma = 0.005
hedge_band = 15
risk_limit = 60
max_loss = 500
min_quote_life_ms = 10000 ; a quote is kept this long unless it must go (DESIGN.md §8)
wait_cancel_ack = true    ; one order in flight per side: replace only once the cancel is confirmed

[paper]
latency_ms = 50

[factor BTC]
level = 65100
vol = 4.88
[factor ETH]
level = 1827
vol = 0.172

[corr]
BTC ETH = 0.7

[instrument BTC-USDT-PERP]
feed = BINANCE-PERP:BTCUSDT
class = crypto_perp
tick = 0.1
lot = 0.001
mult = 1
quote_size = 0.005
max_pos = 0.1
A0 = 0.274
k0 = 2.33
pricer = linear BTC
ref_for = BTC
hedges = BTC

[instrument ETH-USDT-PERP]
feed = BINANCE-PERP:ETHUSDT
class = crypto_perp
tick = 0.01
lot = 0.001
mult = 1
quote_size = 0.1
max_pos = 2
A0 = 0.276
k0 = 19.7
pricer = linear ETH
ref_for = ETH
hedges = ETH
