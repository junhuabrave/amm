; BTC and ETH USD-M perpetuals on Binance, each the reference market for its
; own factor. Matches:  python3 feeds/binance_ws.py --perp BTCUSDT ETHUSDT
; (the REST adapter, feeds/binance.py --perp BTCUSDT ETHUSDT, also works).
; vol / A0 / k0 / corr come from amm_calibrate on a 15-minute websocket capture
; taken 2026-11-15 17:52-18:07 UTC (every book change and aggregated trade).
; That is one Sunday-evening sample: recalibrate on longer recordings before
; relying on them. vol is the calibrator's total including jumps (diffusive
; alone: BTC 4.29, ETH 0.184; four and two jumps in the window).

[engine]
gamma = 0.05
hedge_band = 15
risk_limit = 60
max_loss = 500
min_quote_life_ms = 250   ; keeps the order rate inside venue limits on tick data

[paper]
latency_ms = 50

[factor BTC]
level = 64500
vol = 4.65
[factor ETH]
level = 1815
vol = 0.19

[corr]
BTC ETH = 0.7

[instrument BTC-USDT-PERP]
feed = BINANCE-PERP:BTCUSDT
class = crypto_perp
tick = 0.1
lot = 0.001
mult = 1
quote_size = 0.005
max_pos = 0.1
A0 = 0.32
k0 = 1.9
pricer = linear BTC
ref_for = BTC
hedges = BTC

[instrument ETH-USDT-PERP]
feed = BINANCE-PERP:ETHUSDT
class = crypto_perp
tick = 0.01
lot = 0.001
mult = 1
quote_size = 0.1
max_pos = 2
A0 = 0.38
k0 = 17.3
pricer = linear ETH
ref_for = ETH
hedges = ETH
