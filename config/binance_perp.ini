; BTC and ETH USD-M perpetuals on Binance, each the reference market for its
; own factor. Matches:  python3 feeds/binance_ws.py --perp BTCUSDT ETHUSDT
; (the REST adapter, feeds/binance.py --perp BTCUSDT ETHUSDT, also works).
; vol / A0 / k0 / corr come from amm_calibrate on a 4-hour websocket capture,
; 2026-11-15 20:30 to 11-16 00:30 UTC (11.3M events, no reconnects). vol is the total
; including jumps (diffusive alone: BTC 3.83, ETH 0.152; 29 and 21 jumps/hour).
; gamma, min_quote_life_ms and wait_cancel_ack were chosen with amm_sweep
; ensembles on three sessions (15 min Sunday evening, 4 h Sunday night, 18 min
; Monday morning 2026-11-16 08:19-08:37 UTC).
;
; FEES DECIDE THIS. maker_fee / taker_fee below are Binance USD-M's base tier
; (0.02% / 0.05%; check your own tier). At that tier, quoting at the touch
; lost on two of three sessions (-11.4, +5.5, -5.3 paper, post-only fills).
; With fees_in_quotes the engine widens each quote by the fee (13 USDT on
; BTC), so it rarely quotes: small volume, and a result that rests on a few
; big moves. At-the-touch quoting was positive on all three only with a maker
; rebate (-0.005%: +0.6, +15.4, +79.2); break-even is near 0.01%. See
; DESIGN.md section 11.

[engine]
gamma = 0.005
hedge_band = 15
risk_limit = 60
max_loss = 500
min_quote_life_ms = 30000 ; a quote is kept this long unless it must go (DESIGN.md §8)
wait_cancel_ack = true    ; one order in flight per side: replace only once the cancel is confirmed
fees_in_quotes = true     ; widen quotes by the maker fee: never quote where the edge cannot pay it

[paper]
latency_ms = 50
post_only = true          ; a quote that would take liquidity on arrival is rejected, as GTX is live

[factor BTC]
level = 65100
vol = 4.88
[factor ETH]
level = 1827
vol = 0.172

[corr]
BTC ETH = 0.7

[instrument BTC-USDT-PERP]
feed = BINANCE-PERP:BTCUSDT
maker_fee = 0.0002
taker_fee = 0.0005
class = crypto_perp
tick = 0.1
lot = 0.001
mult = 1
quote_size = 0.005
max_pos = 0.1
A0 = 0.274
k0 = 2.33
pricer = linear BTC
ref_for = BTC
hedges = BTC

[instrument ETH-USDT-PERP]
feed = BINANCE-PERP:ETHUSDT
maker_fee = 0.0002
taker_fee = 0.0005
class = crypto_perp
tick = 0.01
lot = 0.001
mult = 1
quote_size = 0.1
max_pos = 2
A0 = 0.276
k0 = 19.7
pricer = linear ETH
ref_for = ETH
hedges = ETH
