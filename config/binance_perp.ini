; BTC and ETH USD-M perpetuals on Binance, each the reference market for its
; own factor. Matches:  python3 feeds/binance.py --perp BTCUSDT ETHUSDT
; vol / A0 / k0 / corr are to be replaced with amm_calibrate output.

[engine]
gamma = 0.05
hedge_band = 15
risk_limit = 60
max_loss = 500

[paper]
latency_ms = 50

[factor BTC]
level = 65000
vol = 6.0
[factor ETH]
level = 3400
vol = 0.45

[corr]
BTC ETH = 0.8

[instrument BTC-USDT-PERP]
feed = BINANCE-PERP:BTCUSDT
class = crypto_perp
tick = 0.1
lot = 0.001
mult = 1
quote_size = 0.005
max_pos = 0.1
A0 = 1.0
k0 = 0.5
pricer = linear BTC
ref_for = BTC
hedges = BTC

[instrument ETH-USDT-PERP]
feed = BINANCE-PERP:ETHUSDT
class = crypto_perp
tick = 0.01
lot = 0.001
mult = 1
quote_size = 0.1
max_pos = 2
A0 = 1.0
k0 = 5
pricer = linear ETH
ref_for = ETH
hedges = ETH
