; BTC and ETH USD-M perpetuals on Binance, each the reference market for its
; own factor. Matches:  python3 feeds/binance.py --perp BTCUSDT ETHUSDT
; vol / A0 / k0 / corr come from amm_calibrate on a 5-minute capture taken
; 2026-11-15 13:40 UTC (REST polled at 1 s). That is one quiet Sunday sample:
; recalibrate on a longer recording before relying on them. corr uses 5 s
; changes because the two symbols are polled a fraction of a second apart.

[engine]
gamma = 0.05
hedge_band = 15
risk_limit = 60
max_loss = 500

[paper]
latency_ms = 50

[factor BTC]
level = 65000
vol = 3.5
[factor ETH]
level = 1830
vol = 0.12

[corr]
BTC ETH = 0.7

[instrument BTC-USDT-PERP]
feed = BINANCE-PERP:BTCUSDT
class = crypto_perp
tick = 0.1
lot = 0.001
mult = 1
quote_size = 0.005
max_pos = 0.1
A0 = 0.48
k0 = 3.5
pricer = linear BTC
ref_for = BTC
hedges = BTC

[instrument ETH-USDT-PERP]
feed = BINANCE-PERP:ETHUSDT
class = crypto_perp
tick = 0.01
lot = 0.001
mult = 1
quote_size = 0.1
max_pos = 2
A0 = 0.44
k0 = 24.5
pricer = linear ETH
ref_for = ETH
hedges = ETH
