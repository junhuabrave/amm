; The simulator's reference universe (include/amm/sim/scenario.hpp) as a config
; file. Use it to replay journals written by amm_record_sim:
;   ./build/amm_record_sim --out data/sim.csv
;   ./build/amm_run --config config/sim.ini --replay data/sim.csv
; Volatilities are per sqrt(second) in the factor's own units.

[engine]
gamma = 0.05
hedge_band = 40
risk_limit = 400

[paper]
latency_ms = 0.2

[factor EQ]
level = 100
vol = 0.0124
[factor VOL]
level = 0.30
vol = 1.2e-4
[factor BTC]
level = 60000
vol = 6.4
[factor RATE]
level = 400
vol = 0.033
[factor CREDIT]
level = 120
vol = 0.0165

[corr]
EQ VOL = -0.7
EQ BTC = 0.3
EQ CREDIT = -0.5
RATE CREDIT = -0.2

[instrument ACME]
class = equity
tick = 0.01
lot = 1
mult = 1
quote_size = 100
max_pos = 50000
A0 = 1.4
k0 = 104
pricer = linear EQ
ref_for = EQ
hedges = EQ

